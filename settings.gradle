pluginManagement {
    plugins {
        id "io.ballerina.plugin" version "${ballerinaGradlePluginVersion}"
        id "net.researchgate.release" version "${releasePluginVersion}"
    }
    repositories {
        gradlePluginPortal()
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }
}

plugins {
    id "com.gradle.develocity" version "3.19.2"
}

def projectName = 'authzen'
rootProject.name = "module-ballerina-${projectName}"

include ":${projectName}-ballerina"
include ":${projectName}-examples"

project(":${projectName}-ballerina").projectDir = file('ballerina')
project(":${projectName}-examples").projectDir = file('examples')

develocity {
    buildScan {
        termsOfUseUrl = 'https://gradle.com/help/legal-terms-of-use'
        termsOfUseAgree = 'yes'
    }
}
