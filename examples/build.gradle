import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.process.ExecOperations

import javax.inject.Inject

abstract class BallerinaExecHelper {
    @Inject abstract ExecOperations getExecOperations()
}

apply plugin: 'java'

description = 'Ballerina - AuthZEN Examples'

// The distribution :authzen-ballerina:build unpacks, with the freshly packed ballerina/authzen bala already in its
// repository, so the examples compile against this checkout's package.
def ballerinaDist = "${project.rootDir}/target/ballerina-runtime"
def examples = [
    "todo-access-check",
    "access-review",
]
def packageName = "authzen"

clean {
    examples.forEach { example ->
        delete "${projectDir}/${example}/target"
    }
}

task buildExamples {
    def execHelper = project.objects.newInstance(BallerinaExecHelper)
    doLast {
        examples.each { example ->
            try {
                execHelper.execOperations.exec {
                    workingDir project.projectDir
                    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                        commandLine 'cmd', '/c', "${ballerinaDist}/bin/bal.bat build ${example} && exit %%ERRORLEVEL%%"
                    } else {
                        commandLine 'sh', '-c', "${ballerinaDist}/bin/bal build ${example}"
                    }
                }
            } catch (Exception e) {
                println("Example '${example}' Build failed: " + e.message)
                throw e
            }
        }
    }
}

buildExamples.dependsOn ":${packageName}-ballerina:build"

build.dependsOn buildExamples
